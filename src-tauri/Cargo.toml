[package]
name = "ancore-scientific-studio"
version = "1.2.0"
description = "AnCore Scientific Studio v1.2 — 6-Stage Structure-Based Virtual Screening & 3-Zone OpenMM 300 K Relaxation Workbench"
authors = ["Ahmed Senary", "Norseen Hosam Eldeen"]
license = "MIT"
repository = "https://github.com/norseenhosameldeen/AnCore-Scientific-Studio"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6", features = ["fs-all", "path-all", "process-command-api", "shell-open", "dialog-all"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
